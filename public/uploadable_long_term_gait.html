<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long-Term Gait Analysis Upload</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .upload-card { background: #1e293b; padding: 30px; border-radius: 10px; border: 1px solid #334155; width: 400px; text-align: center; }
        input[type="file"] { width: 100%; padding: 10px; margin: 15px 0; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 5px; }
        .btn-submit { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background: #0284c7; color: #fff; }
        .nav-link { display: block; margin-top: 15px; color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="upload-card">
        <h2>Long-Term Gait Upload</h2>
        <p style="color: #94a3b8; font-size: 14px;">Upload your CSV file to generate your evaluation PDF report.</p>
        <form action="/uploadable_long_term_gait" method="POST" enctype="multipart/form-data">
            <input type="file" id="gait_file" name="gait_file" accept=".csv" required>
            <button type="submit" class="btn-submit">Generate PDF Report</button>
        </form>
        <a href="/" class="nav-link">Return to Home</a>
    </div>
</body>
</html>
